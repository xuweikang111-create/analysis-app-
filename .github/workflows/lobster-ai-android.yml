name: LobsterAI Android

on:
  push:
    branches: ["lobster-ai-v2"]
    paths:
      - "LobsterAI/**"
      - ".github/workflows/lobster-ai-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify project
        working-directory: LobsterAI
        run: python3 scripts/verify_project.py

      - name: Build debug APK
        working-directory: LobsterAI
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Run lint
        working-directory: LobsterAI
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LobsterAI-v1.1.1-debug-apk
          path: LobsterAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
