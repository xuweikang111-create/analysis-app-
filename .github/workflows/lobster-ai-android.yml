name: LobsterAI Android

on:
  push:
    branches: ["lobster-ai-v2"]
    paths:
      - "LobsterAI/**"
      - ".github/workflows/lobster-ai-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          SDKROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDKROOT" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDKROOT"
            find "$SDKROOT" -maxdepth 4 -type d | sort | head -n 200
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        working-directory: LobsterAI
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Run lint
        working-directory: LobsterAI
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LobsterAI-v1.1.1-debug-apk
          path: LobsterAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
