name: Miqi Android APK

on:
  push:
    paths:
      - 'LobsterAI/**'
      - '.github/workflows/lobster-ai-android.yml'
  pull_request:
    paths:
      - 'LobsterAI/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    defaults:
      run:
        working-directory: LobsterAI

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android 36 platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: miqi-v1.3.0-debug
          path: LobsterAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Archive exact source
        run: |
          zip -r ../MiqiAI-v1.3.0-source.zip . -x '.gradle/*' 'build/*' 'app/build/*'

      - name: Upload exact source
        uses: actions/upload-artifact@v4
        with:
          name: miqi-v1.3.0-source
          path: MiqiAI-v1.3.0-source.zip
          if-no-files-found: error
