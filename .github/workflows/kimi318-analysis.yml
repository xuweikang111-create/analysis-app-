name: Kimi 3.2.18 patch context probe

on:
  push:
    branches:
      - kimi318-analysis
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful analysis artifact
        uses: actions/download-artifact@v4
        with:
          name: kimi-3.2.17-vs-3.2.18-analysis
          path: artifact
          github-token: ${{ github.token }}
          repository: xuweikang111-create/analysis-app-
          run-id: 39559158080

      - name: Print targeted old/new patch contexts
        shell: bash
        run: |
          set -euo pipefail
          ls -lh artifact
          python3 - <<'PY'
          from pathlib import Path
          import json

          root=Path("artifact")
          data=json.loads((root/"analysis.json").read_text("utf-8"))
          diff=(root/"main-3.2.17-vs-3.2.18.diff").read_text("utf-8",errors="replace")
          lines=diff.splitlines()

          print("===== OLD 3.2.17 ANCHOR CONTEXTS =====")
          for anchor,info in data["anchors"].items():
              if anchor in (
                "function _0xa7af7d() {",
                "async function _0x227e1f() {",
                "async function _0x77ccf3(_0x2c62cd) {",
                "return this.#opts[_0x500c30(5016)]?.()?.[_0x500c30(6736)]() || _0x56b828;"
              ):
                  print("\n###",anchor)
                  print(info.get("3.2.17_context",""))

          targets=[
            "_0x31c1a0",
            "_0x1cd112",
            "_0x4318a2",
            "_0xa7af7d",
            "_0x227e1f",
            "_0x77ccf3",
            "this.#opts[_0x5ab4de(7084)]",
            "this.#opts[_0x500c30(5016)]",
          ]
          print("\n===== UNIFIED DIFF TARGET CONTEXTS =====")
          for target in targets:
              hits=[i for i,line in enumerate(lines) if target in line]
              print("\n### TARGET",target,"HITS",len(hits))
              for num,i in enumerate(hits[:4],1):
                  print("\n--- hit",num,"line",i+1,"---")
                  a=max(0,i-28); b=min(len(lines),i+90)
                  print("\n".join(lines[a:b]))

          print("\n===== FUZZY MAPPINGS =====")
          print(json.dumps(data["fuzzy_mappings"],ensure_ascii=False,indent=2))
          print("\n===== STRUCTURAL RETURN =====")
          print(json.dumps(data["3.2.18_structural_opts_return_matches"],ensure_ascii=False,indent=2))
          PY
