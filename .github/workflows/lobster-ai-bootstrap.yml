name: LobsterAI Android Build

on:
  push:
    branches:
      - lobster-ai-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: lobster-ai-v2
          fetch-depth: 0

      - name: Expand LobsterAI source bundle
        id: expand
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G ".lobster-upload/lobster.part*" > /dev/null; then
            cat .lobster-upload/lobster.part* | base64 --decode > LobsterAI_v1.1.1.zip
            unzip -t LobsterAI_v1.1.1.zip
            rm -rf .lobster-extract LobsterAI
            mkdir -p .lobster-extract
            unzip -q LobsterAI_v1.1.1.zip -d .lobster-extract
            test -d .lobster-extract/LobsterAI_v1.1.1
            mv .lobster-extract/LobsterAI_v1.1.1 LobsterAI
            rm -rf .lobster-extract LobsterAI_v1.1.1.zip .lobster-upload
            rm -rf LobsterAI/.git LobsterAI/github-repo-root
            chmod +x LobsterAI/gradlew || true
            echo "expanded=true" >> "$GITHUB_OUTPUT"
          else
            test -d LobsterAI
            echo "expanded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit expanded source
        if: steps.expand.outputs.expanded == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: expand LobsterAI v1.1.1 source"
            git push origin HEAD:lobster-ai-v2
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify project
        working-directory: LobsterAI
        run: python3 scripts/verify_project.py

      - name: Build debug APK
        working-directory: LobsterAI
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Run Android lint
        working-directory: LobsterAI
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: LobsterAI-v1.1.1-debug-apk
          path: LobsterAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
