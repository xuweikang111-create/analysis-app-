name: Publish MOZHE Kimi 3.2.18 release asset

on:
  push:
    branches:
      - kimi318-publish
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download the already-built plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: MOZHE_KimiWork_Mac_AppleSilicon_3.2.18_COMPAT_v1.0.13_DIRECT
          path: downloaded
          github-token: ${{ github.token }}
          repository: xuweikang111-create/analysis-app-
          run-id: 39599628787

      - name: Repackage as a single direct ZIP
        shell: bash
        run: |
          set -euo pipefail
          ROOT_FILE="$(find downloaded -type f -name install.command -print -quit)"
          test -n "$ROOT_FILE"
          ROOT="$(dirname "$ROOT_FILE")"
          test -f "$ROOT/README.txt"
          test -f "$ROOT/payload/app.asar"
          test -f "$ROOT/payload/Info.plist"

          ZIP="$GITHUB_WORKSPACE/MOZHE-Kimi-3.2.18-v1.0.13.zip"
          (cd "$ROOT" && zip -qr "$ZIP" .)
          unzip -t "$ZIP" | tail -n 2
          shasum -a 256 "$ZIP" | tee "$GITHUB_WORKSPACE/ZIP_SHA256.txt"
          ls -lh "$ZIP"

      - name: Publish permanent GitHub release download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="mozhe-kimi-3.2.18-v1.0.13"
          gh release create "$TAG" \
            "$GITHUB_WORKSPACE/MOZHE-Kimi-3.2.18-v1.0.13.zip" \
            "$GITHUB_WORKSPACE/ZIP_SHA256.txt" \
            --title "MOZHE Kimi Work macOS 3.2.18 v1.0.13" \
            --notes "Kimi 3.2.18.6 compatibility package. Contains installer, rollback, Relay configuration, launcher, diagnostics, and patched app.asar. Verify ZIP_SHA256.txt before installation." \
            --target "$GITHUB_SHA"
