name: Build LobsterAI APK

on:
  push:
    branches: ["main", "lobster-ai-v2"]
    paths:
      - 'LobsterAI/**'
      - '.github/workflows/lobster-ai-android.yml'
  pull_request:
    paths:
      - 'LobsterAI/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: LobsterAI
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Run lint
        run: gradle :app:lintDebug --stacktrace --no-daemon

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LobsterAI-v1.1.1-debug
          path: LobsterAI/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LobsterAI-v1.1.1-lint
          path: LobsterAI/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14